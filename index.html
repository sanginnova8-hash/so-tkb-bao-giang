<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Defensive guard for environments where window.fetch has only a getter without a setter.
      // This prevents "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when libraries, polyfills, or dev tooling attempt to assign or wrap window.fetch.
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If defineProperty is restricted, continue safely
        }
      })();
    </script>
